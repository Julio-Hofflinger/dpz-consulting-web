# ==========================================================================
# Bloque para dpzdata.com — AÑADIR al final de /etc/caddy/Caddyfile
# NO borra lo existente (velvetpremium.cl sigue igual).
# Caddy gestiona HTTPS/Let's Encrypt automáticamente.
# ==========================================================================

dpzdata.com {
	root * /var/www/dpzdata
	encode zstd gzip

	# URLs limpias: /servicios -> servicios.html
	try_files {path} {path}.html {path}/ =404

	file_server

	# Página 404 personalizada
	handle_errors {
		@notfound expression {http.error.status_code} == 404
		rewrite @notfound /404.html
		file_server
	}

	# Caché larga para assets estáticos
	@static {
		path *.css *.js *.webp *.png *.jpg *.jpeg *.svg *.ico *.woff *.woff2
	}
	header @static Cache-Control "public, max-age=31536000, immutable"

	# HTML sin caché agresiva
	@html path *.html
	header @html Cache-Control "no-cache, must-revalidate"

	# Cabeceras de seguridad
	header {
		X-Content-Type-Options "nosniff"
		X-Frame-Options "SAMEORIGIN"
		Referrer-Policy "strict-origin-when-cross-origin"
		-Server
	}
}

www.dpzdata.com {
	redir https://dpzdata.com{uri} permanent
}
