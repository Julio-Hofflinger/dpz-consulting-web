name: DPZ — publicación autónoma del blog

on:
  schedule:
    # 12:15 UTC = 08:15 o 09:15 en Chile según horario oficial vigente.
    # El script vuelve a comprobar America/Santiago antes de publicar.
    - cron: "15 12 * * 2-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Publicar ahora aunque no sea martes-viernes"
        required: false
        default: false
        type: boolean
      deploy_only:
        description: "Desplegar el estado actual sin generar otro artículo"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: dpz-blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DPZ_SSH_HOST: ${{ vars.DPZ_SSH_HOST }}
      DPZ_SSH_USER: ${{ vars.DPZ_SSH_USER }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Preparar Python y Node
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias del publicador
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input Pillow

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Validar y generar artículo
        if: ${{ inputs.deploy_only != true }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ inputs.force || false }}" == "true" ]]; then args+=(--force); fi
          python tools/auto_publish_blog.py "${args[@]}"

      - name: Guardar el artículo y los artefactos generados
        if: ${{ inputs.deploy_only != true }}
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dpz-blog-automation"
          git config user.email "automation@dpzdata.com"
          git add tools/posts.json tools/blog_queue.json blog blog.html sitemap.xml assets/img/photos
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(blog): publicar artículo programado"
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Configurar SSH de despliegue
        if: ${{ inputs.deploy_only == true || steps.commit.outputs.published == 'true' }}
        env:
          DPZ_SSH_PRIVATE_KEY: ${{ secrets.DPZ_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DPZ_SSH_HOST"
          test -n "$DPZ_SSH_USER"
          test -n "$DPZ_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keyscan -H "$DPZ_SSH_HOST" >> "$HOME/.ssh/known_hosts"
          key_file="$RUNNER_TEMP/dpz_deploy_key"
          printf '%s\n' "$DPZ_SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" >/dev/null
          echo "DPZ_SSH_KEY_FILE=$key_file" >> "$GITHUB_ENV"

      - name: Desplegar en dpzdata.com
        if: ${{ inputs.deploy_only == true || steps.commit.outputs.published == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          remote_tmp="/tmp/dpz-autodeploy"
          ssh -i "$DPZ_SSH_KEY_FILE" -o IdentitiesOnly=yes "$DPZ_SSH_USER@$DPZ_SSH_HOST" "mkdir -p '$remote_tmp' && find '$remote_tmp' -mindepth 1 -delete"
          rsync -az --delete -e "ssh -i $DPZ_SSH_KEY_FILE -o IdentitiesOnly=yes" \
            --exclude='Recursos DPZ Consulting' \
            --exclude='tools' --exclude='docs' --exclude='.github' \
            --exclude='README.md' --exclude='AGENTS.md' \
            --exclude='.git' --exclude='node_modules' \
            --exclude='package.json' --exclude='package-lock.json' \
            --exclude='*.bak' --exclude='*.log' \
            --exclude='assets/models/earth_-_16k_high_resolution.glb' \
            ./ "$DPZ_SSH_USER@$DPZ_SSH_HOST:$remote_tmp/"
          ssh -i "$DPZ_SSH_KEY_FILE" -o IdentitiesOnly=yes "$DPZ_SSH_USER@$DPZ_SSH_HOST" "sudo rsync -a --delete '$remote_tmp/' '/var/www/dpzdata/' && sudo chown -R caddy:caddy '/var/www/dpzdata' && sudo chmod -R 755 '/var/www/dpzdata' && find '$remote_tmp' -mindepth 1 -delete"

      - name: Verificar producción
        if: ${{ inputs.deploy_only == true || steps.commit.outputs.published == 'true' }}
        run: node tools/seo-audit.mjs --prod
